# 本机工具验收。cwd_policy.allow 按需改为要操作的目录。
schema_version: 2
node:
  name: local-dev
  roles: [agent, gateway]
gateway:
  listen: 127.0.0.1:8080
mesh:
  lan:
    enabled: true
    mdns: true
  tailnet:
    enabled: false
agent:
  default_cwd: .
  cwd_policy:
    allow: ["."]
    deny: ["~/.ssh", "~/.config/gcloud", "~/.azure"]
  authz:
    tag:peer:
      tools: ["*"]
      backends: ["*"]
