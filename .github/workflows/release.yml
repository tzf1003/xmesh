name: 发布 beta
# 推送形如 v0.2.0-beta.1 的标签时，为 Windows、Linux、macOS 构建二进制并发布 GitHub 预发布版。
on:
  push:
    tags: ['v*-beta*', 'v*-rc*']
permissions:
  contents: write
jobs:
  # 红提交不得发布：同一提交上的 Go 实现与契约夹具两个工作流都必须已经成功（含 Windows 原生作业），
  # 另外在这里重跑 vet、竞态测试和符合性矩阵检查。标签推送得太早时，最多等 30 分钟让它们跑完。
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./... -timeout=300s
      - run: python3 scripts/conformance_check.py
      - name: 同一提交上的 CI 全绿
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_gate.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="xmesh-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          mkdir -p "dist/$name"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.buildVersion=${GITHUB_REF_NAME}" -o "dist/$name/xmesh$ext" ./cmd/xmesh
          cp README.md "dist/$name/" 2>/dev/null || true
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: xmesh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 校验和
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: 发布预发布版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes "测试版：二进制未签名，Windows 生产 L2 仍返回 sandbox.unavailable。"
