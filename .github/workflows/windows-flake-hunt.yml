name: Windows 偶发测试复现
# 反复运行三个仍未确认根因的偶发测试，每个分片一个目标，并分别统计 PASS、FAIL 与 SKIP：
#   delayed-delete：Test_WindowsAppContainerWorkspaceChangeMonitor/delayed-delete（USN 监视器的延迟删除阶段；只有一次重试）
#   cancel：Test_WindowsAppContainerWorkspaceExecution/cancel（生命周期 helper 的就绪等待 20 秒超时）
#   gate1：Test_Gate1_MCPRealHTTP（internal/role/agent 中 exec.run 30 秒超时，master 上出现过一次）
# 与 CI 一样使用 -race，失败时输出相关行，并把每个分片的完整输出作为 artifact 上传。
# pipe-close 作业另外反复关闭控制通道的命名管道监听器：先用裸 go-winio 监听器统计需要第二次 Close
# 才能放行的轮数，再用带保护的监听器确认没有任何一轮卡住。
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/windows-flake-hunt.yml'
jobs:
  hunt:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, target: delayed-delete }
          - { shard: 2, target: delayed-delete }
          - { shard: 3, target: cancel }
          - { shard: 4, target: gate1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/windows-flake-hunt.yml
      - name: Repeat the flaky test
        shell: pwsh
        env:
          XMESH_TEST_WINDOWS_SANDBOX: "1"
          TARGET: ${{ matrix.target }}
          SHARD: ${{ matrix.shard }}
        run: |
          switch ($env:TARGET) {
            'delayed-delete' { $pkg = './internal/winbox'; $run = '^Test_WindowsAppContainerWorkspaceChangeMonitor$/^delayed-delete$'; $name = 'Test_WindowsAppContainerWorkspaceChangeMonitor/delayed-delete' }
            'cancel'         { $pkg = './internal/winbox'; $run = '^Test_WindowsAppContainerWorkspaceExecution$/^cancel$'; $name = 'Test_WindowsAppContainerWorkspaceExecution/cancel' }
            'gate1'          { $pkg = './internal/role/agent'; $run = '^Test_Gate1_MCPRealHTTP$'; $name = 'Test_Gate1_MCPRealHTTP' }
          }
          $count = 60
          $out = "hunt-$($env:SHARD)-$($env:TARGET).txt"
          $started = Get-Date
          go test -race $pkg -run $run -count $count -v -timeout 5400s 2>&1 | Tee-Object -FilePath $out | Out-Null
          $code = $LASTEXITCODE
          $esc = [regex]::Escape($name)
          $pass = @(Select-String -Path $out -Pattern "--- PASS: $esc ").Count
          $fail = @(Select-String -Path $out -Pattern "--- FAIL: $esc ").Count
          $skip = @(Select-String -Path $out -Pattern "--- SKIP: $esc ").Count
          $retry = @(Select-String -Path $out -Pattern 'race runtime failed to start').Count
          $elapsed = [int]((Get-Date) - $started).TotalSeconds
          "==== $name: PASS $pass, FAIL $fail, SKIP $skip, race-start retries $retry, go test exit $code, ${elapsed}s ===="
          Select-String -Path $out -Pattern '--- FAIL|_test.go:|timed out|readiness|DATA RACE|panic|^(ok|FAIL)\s' | ForEach-Object { $_.Line }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunt-${{ matrix.shard }}-${{ matrix.target }}
          path: hunt-*.txt

  pipe-close:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/windows-flake-hunt.yml
      - name: Bare go-winio listener (report only)
        shell: pwsh
        env:
          XMESH_TEST_PIPE_CLOSE_RAW: "1"
          XMESH_TEST_PIPE_CLOSE_ROUNDS: "3000"
        run: |
          go test -race ./internal/control -run '^Test_ControlPipeListenerCloseAfterClientDrops$' -count 1 -v -timeout 1200s 2>&1 | Select-String -Pattern 'bare go-winio|--- (PASS|FAIL)|^(ok|FAIL)\s|_test.go:' | ForEach-Object { $_.Line }
      - name: Guarded listener
        shell: pwsh
        env:
          XMESH_TEST_PIPE_CLOSE_ROUNDS: "3000"
        run: go test -race ./internal/control -run '^Test_ControlPipeListenerCloseAfterClientDrops$|^Test_CONSEC12_LivePipeDACL$' -count 3 -timeout 1200s
