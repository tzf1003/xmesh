name: Go 实现
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/go.yml
      - run: go test -race ./... -timeout=120s
        if: ${{ !cancelled() }}
      - run: go vet ./...
        if: ${{ !cancelled() }}
      - run: go build ./cmd/xmesh
        if: ${{ !cancelled() }}
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows native process, terminal, and file regression
        env:
          XMESH_TEST_WINDOWS_EXEC: "1"
          XMESH_TEST_WINDOWS_PTY: "1"
        run: go test -race ./internal/exec ./internal/pty ./internal/fs -run Windows -v -timeout=180s
      - name: Windows gateway file visibility regression
        run: go test -race ./internal/role/gateway -run '^Test_CTRGW01_03_SessionDefaults$' -count=50 -v -timeout=120s
