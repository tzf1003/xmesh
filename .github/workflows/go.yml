name: Go 实现
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/xmesh
      - name: Windows native process and terminal regression
        if: runner.os == 'Windows'
        env:
          XMESH_TEST_WINDOWS_EXEC: "1"
          XMESH_TEST_WINDOWS_PTY: "1"
        run: go test -race ./internal/exec ./internal/pty -run Windows -v -timeout=180s
