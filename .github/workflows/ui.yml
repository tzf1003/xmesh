# Electron 托盘壳（ui/）：类型检查、单元测试，以及 Windows 与 macOS 上的 Playwright 端到端。
# 端到端对着假内核（ui/testserver）跑，不依赖真实内核。
name: Electron UI

on:
  workflow_call:

defaults:
  run:
    working-directory: ui

jobs:
  verify:
    timeout-minutes: 30
    # 单元测试里的假内核走 Unix 域套接字（ubuntu、macOS）和命名管道（Windows），与真实传输一致。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@v5
        if: runner.os != 'Linux'
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      # 契约的 TS 生成物（api/control/v2/ts/control.ts）变了而 UI 里的副本没跟上，这里会失败。
      - run: npm run check-types
      - run: npm run typecheck
      - run: npm test
      - name: Release fuse profile can be applied and verified
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          node scripts/flip-fuses.mjs --profile release
          node scripts/flip-fuses.mjs --verify --profile release
      - name: Electron end-to-end
        if: runner.os != 'Linux'
        shell: bash
        run: |
          node scripts/build-policy-test-cli.mjs
          node scripts/flip-fuses.mjs --profile test
          npx --no-install playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-${{ matrix.os }}
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
          retention-days: 7
