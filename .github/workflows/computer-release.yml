name: Package native desktop executor
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, goos: darwin, goarch: arm64, target: aarch64-apple-darwin }
          - { runner: macos-latest, goos: darwin, goarch: amd64, target: x86_64-apple-darwin }
          - { runner: windows-latest, goos: windows, goarch: amd64, target: x86_64-pc-windows-msvc }
          - { runner: windows-latest, goos: windows, goarch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: computer-native
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxkbcommon-dev libpipewire-0.3-dev libclang-dev
      - run: cargo build --manifest-path computer-native/Cargo.toml --locked --release --target '${{ matrix.target }}'
        env:
          XMESH_BUILD_VERSION: ${{ inputs.version }}
      - name: Assemble native executor
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          ext=""; [ "$TARGET_OS" = windows ] && ext=".exe"
          output="native/xmesh-computer$ext"
          [ "$TARGET_OS" = darwin ] && output="native/xmesh-computer.app"
          python3 scripts/package_computer.py --binary "computer-native/target/$TARGET/release/xmesh-computer$ext" --output "$output" --platform "$TARGET_OS" --version "$VERSION"
          if [ "$TARGET_OS" = darwin ]; then codesign --force --sign - "$output"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: computer-native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: native/*
          if-no-files-found: error
