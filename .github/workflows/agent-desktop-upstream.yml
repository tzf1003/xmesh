name: agent-desktop upstream

# Once a day, check the npm package agent-desktop. A newer release becomes a draft PR
# that pins its version, its per-platform SHA-256 values and a pending validation
# record. Nothing here runs an upstream binary or the npm postinstall script.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to propose (default: the npm dist-tag latest). A version whose closed proposal left its branch behind needs that branch deleted first.'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/agent-desktop-upstream.yml'
      - 'scripts/agent_desktop_upstream.py'
      - 'scripts/test_agent_desktop_upstream.py'

permissions:
  contents: read

concurrency:
  group: agent-desktop-upstream
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s scripts -p 'test_agent_desktop_upstream.py' -v

  propose:
    needs: test
    # Only the default branch proposes. A dispatch from another branch would be checked against that branch's manifest.
    if: "github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Git gets the token per command in the commit step, so the checkout does not keep it.
          persist-credentials: false

      - name: Compare with upstream and prepare the proposal
        id: check
        run: |
          set -euo pipefail
          # Every pull request counts, closed ones included, because a closed proposal blocks the daily
          # run for its version. gh returns at most --limit entries, so this list is complete only while
          # the repository has fewer than 5000 pull requests; past that, query by branch instead. The commit
          # step reads the same list before it replaces a leftover branch.
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 5000 \
            --json number,state,headRefName,isCrossRepository > "$RUNNER_TEMP/pulls.json"
          python3 scripts/agent_desktop_upstream.py \
            --repo-root . \
            --requested-version "$REQUESTED_VERSION" \
            --pulls "$RUNNER_TEMP/pulls.json" \
            --pr-body "$RUNNER_TEMP/agent-desktop-pr-body.md" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Commit, push and open a draft PR
        if: steps.check.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.check.outputs.branch }}
          TITLE: ${{ steps.check.outputs.title }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The checkout keeps no credentials, so each git command that talks to origin gets the token through an
          # extra header, the same way actions/checkout sends it. The header value is masked before it is used.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
          status=0
          remote=$(git "${git_auth[@]}" ls-remote --exit-code --heads origin "refs/heads/$BRANCH") || status=$?
          replace=()
          if [ "$status" -eq 0 ]; then
            # A leftover branch is replaced only when no pull request in this repository has used it. An open or
            # closed proposal keeps its branch, because a closed proposal can carry notes worth keeping.
            used=$(jq --arg b "$BRANCH" '[.[] | select(.headRefName == $b and (.isCrossRepository | not))] | length' "$RUNNER_TEMP/pulls.json")
            if [ "$used" -ne 0 ]; then
              echo "::error::$BRANCH already exists on origin and a pull request uses it; delete the branch before proposing this version again"
              exit 1
            fi
            remote_sha=${remote%%[[:space:]]*}
            echo "::notice::replacing the leftover $BRANCH at $remote_sha; no pull request has used it"
            replace=(--force-with-lease="refs/heads/$BRANCH:$remote_sha")
          elif [ "$status" -ne 2 ]; then
            echo "::error::could not query origin for $BRANCH (ls-remote exit $status)"
            exit 1
          fi
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "$TITLE" \
            -m "Generated by .github/workflows/agent-desktop-upstream.yml. Draft until the validation record is complete."
          git "${git_auth[@]}" push "${replace[@]}" origin "HEAD:refs/heads/$BRANCH"
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" --body-file "$RUNNER_TEMP/agent-desktop-pr-body.md"; then
            # Delete only the branch this run just pushed, and only while it still points at that commit, so a
            # leftover branch with no pull request does not block every later daily run.
            pushed=$(git rev-parse HEAD)
            git "${git_auth[@]}" push --force-with-lease="refs/heads/$BRANCH:$pushed" origin ":refs/heads/$BRANCH" \
              || echo "::warning::could not delete $BRANCH; delete it before the next run"
            exit 1
          fi
          # A push made with GITHUB_TOKEN does not start pull_request workflows, so start the
          # Go CI on the proposal branch by hand. This is best effort.
          gh workflow run go.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" \
            || echo "::warning::could not start CI on $BRANCH; start it from the Actions tab"
