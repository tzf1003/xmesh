name: Headscale 互联与 OAuth 协议
# 临时 HTTPS Headscale 上运行两个已完成公钥配对的新版设备节点，验证双向文件、exec、PTY。
# 第三个 Ingress 节点验证完整 OAuth 流程；两个独立 Docker 网络空间验证双路径及 DERP 恢复。
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  HEADSCALE_VERSION: "0.29.5"
  # linux/amd64 发布资产的 SHA-256，取自 https://github.com/juanfont/headscale/releases/tag/v0.29.5 的 checksums.txt。
  HEADSCALE_SHA256: e979d27fe17d924d33bb6ab7504f6338d0635989a0cfdcfbc0ceb637dbcbe980
jobs:
  headscale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/headscale.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 下载并校验 Headscale
        run: |
          curl -fsSL -o "$RUNNER_TEMP/headscale" "https://github.com/juanfont/headscale/releases/download/v${HEADSCALE_VERSION}/headscale_${HEADSCALE_VERSION}_linux_amd64"
          echo "${HEADSCALE_SHA256}  $RUNNER_TEMP/headscale" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/headscale"
      - name: 构建 xmesh
        run: go build -o "$RUNNER_TEMP/xmesh" ./cmd/xmesh
      - name: 新版设备双向互调与 ingress OAuth 协议
        run: python3 scripts/headscale_ci.py --headscale "$RUNNER_TEMP/headscale" --binary "$RUNNER_TEMP/xmesh" --ingress
      - name: 独立网络空间的 LAN 与 Tailnet 共存
        run: python3 scripts/coexist_ci.py --headscale "$RUNNER_TEMP/headscale" --binary "$RUNNER_TEMP/xmesh"
      - name: DERP 路径及资源恢复
        run: python3 scripts/coexist_ci.py --headscale "$RUNNER_TEMP/headscale" --binary "$RUNNER_TEMP/xmesh" --force-derp
