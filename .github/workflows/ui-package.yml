# 桌面 UI 安装包：Windows（NSIS 安装程序，x64 与 arm64）和 macOS（dmg，arm64 与 x64），每个安装包内置同平台的 xmesh 内核。
#
# 三种触发：
#   pull_request     只在打包相关文件变化时跑，只构建本机架构（win x64、mac arm64）并做启动冒烟，保持 PR 反馈快。
#   workflow_dispatch  手动构建全部四个目标，产物挂在运行页上，用来在发布前试装。
#   workflow_call    release.yml 的 ui 作业调用（见 ui/README.md「并入发布流水线」），传入标签作为 version。
#
# Stable releases require verified signing and macOS notarization/stapling. Testing may explicitly report unsigned assets.
# Credentials are supplied by repository secrets:
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD                 Windows Authenticode 证书（.pfx 的 base64）与口令
#   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD                 Developer ID Application 证书（.p12 的 base64）与口令
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   公证
name: 打包桌面 UI

on:
  pull_request:
    paths:
      - ".github/workflows/ui-package.yml"
      - "ui/package.json"
      - "ui/package-lock.json"
      - "ui/electron-builder.config.mjs"
      - "ui/scripts/**"
      - "ui/build/**"
      - "ui/src/main/cli.ts"
      - "computer-native/**"
      - "scripts/package_computer.py"
  workflow_dispatch:
    inputs:
      version:
        description: "写入安装包的版本，形如 v0.1.0-beta.1"
        required: false
        default: "v0.0.0-dev"
  workflow_call:
    inputs:
      version:
        description: "写入安装包的版本，形如 v0.1.0-beta.1"
        required: true
        type: string
      require_signing:
        description: "Require verified platform signatures and macOS notarization/stapling"
        default: false
        required: false
        type: boolean
    secrets:
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: ui-package-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          full='[
            {"runner":"windows-latest","platform":"win","arch":"x64","goos":"windows","goarch":"amd64","flags":"--win --x64","unpacked":"win-unpacked","ext":"exe","native":true},
            {"runner":"windows-latest","platform":"win","arch":"arm64","goos":"windows","goarch":"arm64","flags":"--win --arm64","unpacked":"win-arm64-unpacked","ext":"exe","native":false},
            {"runner":"macos-latest","platform":"mac","arch":"arm64","goos":"darwin","goarch":"arm64","flags":"--mac --arm64","unpacked":"mac-arm64","ext":"dmg","native":true},
            {"runner":"macos-latest","platform":"mac","arch":"x64","goos":"darwin","goarch":"amd64","flags":"--mac --x64","unpacked":"mac","ext":"dmg","native":false}
          ]'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "matrix=$(jq -c '[.[] | select(.native)]' <<<"$full")" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(jq -c '.' <<<"$full")" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: plan
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ui
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REQUIRE_SIGNING: ${{ inputs.require_signing || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: computer-native

      - name: 解析版本
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-v0.0.0-ci.${GITHUB_RUN_NUMBER}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # 与 release.yml 相同的标志，所以安装包里的内核和单独发布的内核是同一份构建配方。
      - name: 构建内置内核
        working-directory: .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p ui/build/kernel
          go build -trimpath -ldflags "-s -w -X main.buildVersion=${TAG}" -o "ui/build/kernel/xmesh${ext}" ./cmd/xmesh

      - run: npm ci
      - run: npm run build

      - name: 构建桌面执行器
        working-directory: .
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ "$TARGET_OS" = darwin ]; then
            target="aarch64-apple-darwin"; [ "$TARGET_ARCH" = amd64 ] && target="x86_64-apple-darwin"
          else
            target="x86_64-pc-windows-msvc"; [ "$TARGET_ARCH" = arm64 ] && target="aarch64-pc-windows-msvc"
          fi
          rustup target add "$target"
          XMESH_BUILD_VERSION="$TAG" cargo build --manifest-path computer-native/Cargo.toml --release --locked --target "$target"
          ext=""; [ "$TARGET_OS" = windows ] && ext=".exe"
          output="ui/build/kernel/xmesh-computer$ext"
          [ "$TARGET_OS" = darwin ] && output="ui/build/kernel/xmesh-computer.app"
          python3 scripts/package_computer.py --binary "computer-native/target/$target/release/xmesh-computer$ext" --output "$output" --platform "$TARGET_OS" --version "$TAG"

      # Stable packaging fails before build when required credentials are absent.
      - name: 启用签名
        id: sign
        run: |
          signed=false
          if [ "${{ matrix.platform }}" = win ] && [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            signed=true
          elif [ "${{ matrix.platform }}" = mac ] && [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            signed=true
          fi
          if [ "$REQUIRE_SIGNING" = true ]; then
            test "$signed" = true || { echo "Stable releases require code-signing credentials." >&2; exit 1; }
            if [ "${{ matrix.platform }}" = mac ]; then
              test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo "Stable macOS releases require notarization credentials." >&2; exit 1; }
            fi
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: 签名 Windows 内置 CLI
        if: matrix.platform == 'win' && steps.sign.outputs.signed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = Join-Path $env:RUNNER_TEMP 'xmesh-signing.pfx'
          try {
            if ($env:WIN_CSC_LINK.StartsWith('https://')) { Invoke-WebRequest -Uri $env:WIN_CSC_LINK -OutFile $cert }
            elseif ($env:WIN_CSC_LINK -match '^[A-Za-z0-9+/=\r\n]+$') { [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WIN_CSC_LINK)) }
            else { Copy-Item -LiteralPath $env:WIN_CSC_LINK -Destination $cert }
            $tool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
            if (!$tool) { throw 'Windows SDK signtool is required for release signing.' }
            & $tool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $cert /p $env:WIN_CSC_KEY_PASSWORD build/kernel/xmesh.exe
            if ($LASTEXITCODE -ne 0) { throw 'Bundled CLI signing failed.' }
          } finally { Remove-Item -LiteralPath $cert -Force -ErrorAction SilentlyContinue }

      - name: 打包
        env:
          XMESH_KERNEL_BIN: ${{ github.workspace }}/ui/build/kernel/xmesh${{ matrix.platform == 'win' && '.exe' || '' }}
          XMESH_COMPUTER_BIN: ${{ github.workspace }}/ui/build/kernel/xmesh-computer${{ matrix.platform == 'win' && '.exe' || '.app' }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          extra=()
          if [ "${{ matrix.platform }}" = mac ] && [ "${{ steps.sign.outputs.signed }}" = true ]; then extra=(-c.dmg.sign=true); fi
          npx electron-builder --config electron-builder.config.mjs ${{ matrix.flags }} --publish never -c.extraMetadata.version="$VERSION" "${extra[@]}"

      - name: 校验安装包内容与 fuses
        run: |
          extra=""
          if [ "${{ matrix.native }}" = true ]; then extra="--run-kernel --smoke"; fi
          node scripts/verify-package.mjs --dir "release/${{ matrix.unpacked }}" --kernel --computer $extra

      - name: 验证 Windows 签名
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = $env:SIGNED -eq 'true'
          if ($signed) {
            $files = @((Get-ChildItem 'release/xmesh-ui-*.exe').FullName, 'release/${{ matrix.unpacked }}/xmesh.exe', 'release/${{ matrix.unpacked }}/resources/bin/xmesh.exe')
            foreach ($file in $files) {
              $sig = Get-AuthenticodeSignature -LiteralPath $file
              if ($sig.Status -ne 'Valid') { throw "Authenticode verification failed for $file : $($sig.Status)" }
            }
          }
          @{signed=$signed; notarized=$false; stapled=$false} | ConvertTo-Json | Set-Content -Encoding utf8 'release/signing-windows-${{ matrix.goarch }}.json'

      - name: 验证 macOS 分发签名、公证与装订
        if: matrix.platform == 'mac'
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          signed=false; notarized=false; stapled=false
          if [ "$SIGNED" = true ]; then
            app="release/${{ matrix.unpacked }}/xmesh.app"
            codesign --verify --deep --strict "$app"
            signed=true
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=2 "$app"
              dmg=$(find release -maxdepth 1 -name 'xmesh-ui-*.dmg' -print -quit)
              codesign --verify --strict "$dmg"
              xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
              mount=$(mktemp -d)
              hdiutil attach "$dmg" -mountpoint "$mount" -readonly -nobrowse -quiet
              trap 'hdiutil detach "$mount" -quiet; rmdir "$mount"' EXIT
              codesign --verify --deep --strict "$mount/xmesh.app"
              xcrun stapler validate "$mount/xmesh.app"
              spctl --assess --type execute --verbose=2 "$mount/xmesh.app"
              notarized=true; stapled=true
            fi
          fi
          if [ "$REQUIRE_SIGNING" = true ]; then test "$signed:$notarized:$stapled" = true:true:true; fi
          printf '{"signed":%s,"notarized":%s,"stapled":%s}\n' "$signed" "$notarized" "$stapled" > "release/signing-darwin-${{ matrix.goarch }}.json"

      - name: 摘要
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          {
            echo "### ${{ matrix.platform }}-${{ matrix.arch }}"
            echo "- 版本 \`${{ steps.ver.outputs.tag }}\`，签名：\`$SIGNED\`"
            ls -l release/xmesh-ui-*.${{ matrix.ext }} | awk '{print "- `" $NF "` " $5 " 字节"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: xmesh-ui-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ui/release/xmesh-ui-*.${{ matrix.ext }}
            ui/release/signing-${{ matrix.goos }}-${{ matrix.goarch }}.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
