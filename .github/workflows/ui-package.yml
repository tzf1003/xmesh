# 桌面 UI 安装包：Windows（NSIS 安装程序，x64 与 arm64）和 macOS（dmg，arm64 与 x64），每个安装包内置同平台的 xmesh 内核。
#
# 三种触发：
#   pull_request     只在打包相关文件变化时跑，只构建本机架构（win x64、mac arm64）并做启动冒烟，保持 PR 反馈快。
#   workflow_dispatch  手动构建全部四个目标，产物挂在运行页上，用来在发布前试装。
#   workflow_call    release.yml 的 ui 作业调用（见 ui/README.md「并入发布流水线」），传入标签作为 version。
#
# 代码签名只由仓库 secrets 驱动，没有 secrets 时照常产出未签名安装包：
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD                 Windows Authenticode 证书（.pfx 的 base64）与口令
#   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD                 Developer ID Application 证书（.p12 的 base64）与口令
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   公证
name: 打包桌面 UI

on:
  pull_request:
    paths:
      - ".github/workflows/ui-package.yml"
      - "ui/package.json"
      - "ui/package-lock.json"
      - "ui/electron-builder.config.mjs"
      - "ui/scripts/**"
      - "ui/build/**"
      - "ui/src/main/cli.ts"
  workflow_dispatch:
    inputs:
      version:
        description: "写入安装包的版本，形如 v0.1.0-beta.1"
        required: false
        default: "v0.0.0-dev"
  workflow_call:
    inputs:
      version:
        description: "写入安装包的版本，形如 v0.1.0-beta.1"
        required: true
        type: string
    secrets:
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: ui-package-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          full='[
            {"runner":"windows-latest","platform":"win","arch":"x64","goos":"windows","goarch":"amd64","flags":"--win --x64","unpacked":"win-unpacked","ext":"exe","native":true},
            {"runner":"windows-latest","platform":"win","arch":"arm64","goos":"windows","goarch":"arm64","flags":"--win --arm64","unpacked":"win-arm64-unpacked","ext":"exe","native":false},
            {"runner":"macos-latest","platform":"mac","arch":"arm64","goos":"darwin","goarch":"arm64","flags":"--mac --arm64","unpacked":"mac-arm64","ext":"dmg","native":true},
            {"runner":"macos-latest","platform":"mac","arch":"x64","goos":"darwin","goarch":"amd64","flags":"--mac --x64","unpacked":"mac","ext":"dmg","native":false}
          ]'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "matrix=$(jq -c '[.[] | select(.native)]' <<<"$full")" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(jq -c '.' <<<"$full")" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: plan
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ui
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 解析版本
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-v0.0.0-ci.${GITHUB_RUN_NUMBER}}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # 与 release.yml 相同的标志，所以安装包里的内核和单独发布的内核是同一份构建配方。
      - name: 构建内置内核
        working-directory: .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p ui/build/kernel
          go build -trimpath -ldflags "-s -w -X main.buildVersion=${TAG}" -o "ui/build/kernel/xmesh${ext}" ./cmd/xmesh

      - run: npm ci
      - run: npm run build

      # 有证书才启用签名；没有就产出未签名安装包。
      - name: 启用签名
        id: sign
        run: |
          signed=false
          if [ "${{ matrix.platform }}" = win ] && [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            signed=true
          elif [ "${{ matrix.platform }}" = mac ] && [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            signed=true
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: 打包
        env:
          XMESH_KERNEL_BIN: ${{ github.workspace }}/ui/build/kernel/xmesh${{ matrix.platform == 'win' && '.exe' || '' }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: npx electron-builder --config electron-builder.config.mjs ${{ matrix.flags }} --publish never -c.extraMetadata.version="$VERSION"

      - name: 校验安装包内容与 fuses
        run: |
          extra=""
          if [ "${{ matrix.native }}" = true ]; then extra="--run-kernel --smoke"; fi
          node scripts/verify-package.mjs --dir "release/${{ matrix.unpacked }}" --kernel $extra

      - name: 摘要
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          {
            echo "### ${{ matrix.platform }}-${{ matrix.arch }}"
            echo "- 版本 \`${{ steps.ver.outputs.tag }}\`，签名：\`$SIGNED\`"
            ls -l release/xmesh-ui-*.${{ matrix.ext }} | awk '{print "- `" $NF "` " $5 " 字节"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: xmesh-ui-${{ matrix.platform }}-${{ matrix.arch }}
          path: ui/release/xmesh-ui-*.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
