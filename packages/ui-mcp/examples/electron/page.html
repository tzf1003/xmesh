<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>UI MCP test application</title>
  </head>
  <body>
    <nav><button data-testid="nav-settings">Settings</button></nav>
    <section data-testid="settings" hidden>
      <label>Node name<input aria-label="Node name" /></label
      ><button data-testid="review">Review</button>
    </section>
    <dialog data-testid="confirm">
      <p>Apply the change?</p>
      <button data-testid="confirm-ok">Apply</button>
    </dialog>
    <p data-testid="applied"></p>
    <script src="page.js"></script>
  </body>
</html>
