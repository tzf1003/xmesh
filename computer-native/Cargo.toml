[package]
name = "xmesh-computer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
fs2 = "0.4"
libc = "0.2"
enigo = { version = "=0.6.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "=0.10.1", default-features = false, features = ["async", "sc", "av", "cv", "dispatch", "macos_14_0"] }
futures = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "=0.6.1", default-features = false, features = ["x11rb"] }
ashpd = "=0.12.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
pipewire = "=0.8.0"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
futures-util = "0.3"
xkeysym = "0.2"
dbus = "0.9"
x11rb = { version = "0.13", features = ["randr", "screensaver", "xinput"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
