<!doctype html>
<html lang="zh-CN" data-theme="jade">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>xmesh · 会话设计预览</title><link rel="stylesheet" href="../device-management/style.css"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="../device-management/shared/navigation.css"><link rel="stylesheet" href="../device-management/shared/roles.css"></head>
<body data-preview-page="sessions">
<!-- Design preview for a unified execution and audit view. Sample tool lifecycles
     include proposed runtime aggregation; no production services are called. -->
<div class="preview-bar"><span class="preview-title"><span class="preview-dot"></span>会话 <span class="muted">/ 设计预览 · 示例数据</span></span><div class="preview-options"><div class="segmented" aria-label="预览场景"><button data-scene="sample" aria-pressed="true">执行示例</button><button data-scene="empty" aria-pressed="false">空状态</button></div><button class="demo-step" data-action="complete-demo">演示完成 → 归档</button><span class="preview-divider"></span><button class="swatch selected" data-theme="jade" aria-label="翡翠深色" aria-pressed="true"><span style="background:#56d3a4"></span></button><button class="swatch" data-theme="graphite" aria-label="石墨深色" aria-pressed="false"><span style="background:#afb7c2"></span></button><button class="swatch" data-theme="light" aria-label="清透浅色" aria-pressed="false"><span style="background:#f4f6f4"></span></button></div></div>
<div class="app">
  <header class="topbar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span class="brand">xmesh<span class="brand-dot">.</span></span><span class="top-divider"></span><span class="host-name">xiaosong-mac</span><div class="top-spacer"></div><div class="roles"><span><i class="dot"></i>agent</span><span><i class="dot"></i>gateway</span><span class="inactive"><i class="dot"></i>ingress</span></div><span class="health"><i class="dot"></i>运行正常</span></header>
  <div class="app-body">
    <aside class="sidebar" aria-label="主导航"></aside>
    <main><div class="workspace">
      <div class="breadcrumb">网络 <span>/</span><strong>会话</strong></div>
      <div class="page-heading"><div><h1>会话</h1><p>统一查看工具执行、历史记录与审计事件。</p></div><div class="heading-actions"><span class="scope"><span data-icon="network"></span>xiaosong-mac <span class="badge subtle">Gateway</span></span><button class="button" data-action="refresh"><span data-icon="refresh"></span>刷新</button></div></div>
      <div class="overview-strip"><div><span class="overview-icon" data-icon="activity"></span><span><span class="overview-label">正在运行</span><strong id="running-count">5</strong></span></div><div><span class="overview-label">等待执行</span><strong id="queued-count">1</strong></div><div><span class="overview-label">今日记录</span><strong id="history-count">11</strong></div><button data-action="show-errors"><span class="overview-label">失败与拒绝</span><strong id="error-count" class="warn-text">2</strong><span data-icon="chevron"></span></button><span class="overview-live"><i class="dot"></i>实时更新</span></div>
      <div class="view-tabs" role="tablist" aria-label="执行视图"><button role="tab" id="tab-live" data-view="live" aria-selected="true" aria-controls="execution-panel" tabindex="0">实时执行 <span id="live-tab-count">6</span></button><button role="tab" id="tab-history" data-view="history" aria-selected="false" aria-controls="execution-panel" tabindex="-1">历史记录 <span id="history-tab-count">11</span></button><button role="tab" id="tab-resources" data-view="resources" aria-selected="false" aria-controls="execution-panel" tabindex="-1">会话与资源 <span id="resource-tab-count">4</span></button><span class="view-trailing" id="view-trailing">所有工具调用</span></div>
      <section id="execution-panel" role="tabpanel" aria-labelledby="tab-live">
        <div class="filter-bar"><label class="search"><span data-icon="search"></span><input id="execution-search" type="search" aria-label="搜索工具、对象或调用者" placeholder="搜索工具、对象或调用者…"></label><select id="type-filter" aria-label="工具类型"></select><select id="device-filter" aria-label="目标设备"><option value="all">全部设备</option><option>xiaosong-mac</option><option>build-linux</option><option>office-windows</option></select><select id="status-filter" aria-label="执行状态"></select><button class="button filter-more" data-action="more-filters" aria-expanded="false" aria-controls="advanced-filters"><span data-icon="sliders"></span>更多筛选<span id="filter-count"></span></button></div>
        <div class="advanced-filters" id="advanced-filters" hidden><label>调用者<input id="caller-filter" placeholder="客户端或调用者 ID"></label><label>事件类型<select id="event-filter"><option value="all">全部事件</option><option value="tool_call">工具调用</option><option value="authz_deny">访问拒绝</option><option value="control_call">控制操作</option><option value="policy_reload_failed">策略加载失败</option><option value="device_link_reconnecting">设备重连</option><option value="pty_open">终端打开</option></select></label><label>起始时间<input id="since-filter" type="datetime-local"></label><label>截止时间<input id="until-filter" type="datetime-local"></label><button class="text-action" data-action="reset">重置筛选</button></div>
        <div class="result-heading"><span id="result-summary">6 项正在执行</span><span id="time-scope">当前 Gateway 及其路由的调用</span></div>
        <div class="execution-layout"><section class="execution-list"><div class="execution-columns" id="columns"></div><div id="execution-rows"></div><div class="execution-list-foot"><span id="foot-summary"></span><button class="text-action" id="more-records" data-action="load-more" hidden>加载更多<span data-icon="chevron"></span></button><span id="list-hint">选择一项查看执行详情</span></div></section><aside id="execution-detail" class="execution-detail" aria-label="执行详情"></aside></div>
        <div class="view-note" id="view-note"><span data-icon="info"></span><span>工具调用按实际执行状态更新，完成后归入历史记录。</span></div>
      </section>
    </div></main>
  </div>
</div>
<dialog id="execution-drawer" aria-label="执行详情"><div class="mobile-detail-header"><span>执行详情</span><button class="icon-button" data-action="close-detail" aria-label="关闭详情"><span data-icon="close"></span></button></div><div id="mobile-detail"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./icons.js"></script><script src="./prototype.js"></script><script src="../device-management/shared/navigation.js"></script>
<script src="../device-management/shared/roles.js"></script></body></html>
